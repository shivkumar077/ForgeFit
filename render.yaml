services:
  - type: web
    name: forgefit-api
    runtime: python
    buildCommand: pip install ".[web]"
    startCommand: uvicorn forgefit.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: FORGEFIT_REPORTS_DIR
        value: /var/data/reports
      - key: FORGEFIT_CORS_ORIGINS
        sync: false
      - key: FORGEFIT_API_KEY
        sync: false
    disk:
      name: forgefit-data
      mountPath: /var/data
      sizeGB: 1
